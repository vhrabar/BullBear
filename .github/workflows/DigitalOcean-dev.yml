name: Deploy to DigitalOcean

on:
  push:
    branches: ["dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Upload project files
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ \
            root@${{ secrets.DO_DROPLET_IP }}:/root/bullbear/

      - name: Write backend .env on server
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          PRODUCTION: ${{ secrets.PRODUCTION }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          DJANGO_SERVICE_TOKEN: ${{ secrets.DJANGO_SERVICE_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.DO_DROPLET_IP }} << EOF
          cd /root/bullbear/src/backend
          echo -e "DB_NAME=${DB_NAME}\nDB_USER=${DB_USER}\nDB_PASSWORD=${DB_PASSWORD}\nDB_HOST=${DB_HOST}\nDB_PORT=${DB_PORT}\nDB_SSLMODE=${DB_SSLMODE}\nPRODUCTION=${PRODUCTION}\nDJANGO_SERVICE_TOKEN=${DJANGO_SERVICE_TOKEN}" > .env
          cd /root/bullbear/src/scheduler
          echo -e "MASSIVE_API_KEY=${MASSIVE_API_KEY}\nDB_NAME=${DB_NAME}\nDB_USER=${DB_USER}\nDB_PASSWORD=${DB_PASSWORD}\nDB_HOST=${DB_HOST}\nDB_PORT=${DB_PORT}\nDB_SSLMODE=${DB_SSLMODE}\nPRODUCTION=${PRODUCTION}\nDJANGO_SERVICE_TOKEN=${DJANGO_SERVICE_TOKEN}\nDJANGO_API_BASE_URL=https://api.bull-bear.app" > .env


      - name: Rebuild and restart Docker
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.DO_DROPLET_IP }} << EOF
          cd /root/bullbear
          docker compose down
          docker compose build --no-cache
          docker compose up -d
