name: Django Tests

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      -  '**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bullbear_local_test
          POSTGRES_USER: bullbear_tests
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: bullbear_local_test
      DB_USER: bullbear_tests
      DB_PASSWORD: password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_SSLMODE: disable
      SECRET_KEY: test-secret-key
      DEBUG: 'True'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --no-deps -r src/backend/requirements.txt

      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U $DB_USER; do
            echo "Waiting for database..."
            sleep 1
          done

      - name: Run migrations
        run: |
          python src/backend/manage.py makemigrations
          python src/backend/manage.py migrate

      - name: Run tests
        run: |
          python src/backend/manage.py test
